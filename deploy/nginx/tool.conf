# /etc/nginx/sites-available/tool.conf
# Replace tool.example.com with the real subdomain, then run certbot (see DEPLOY.md),
# which adds the 443/SSL server block and the HTTP->HTTPS redirect to this file.
server {
    listen 80;
    listen [::]:80;
    server_name tool.example.com;

    # Templates / rotor / pad photos (backend limit is MAX_UPLOAD_SIZE_MB=20 per file,
    # and /api/generate can carry two images in one request)
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI image generation can take a while once a real API is wired in
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

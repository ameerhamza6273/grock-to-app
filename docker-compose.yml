# Production stack for the VPS. Host Nginx terminates SSL and forwards to the frontend
# on 127.0.0.1:3000 (see deploy/nginx/tool.conf and DEPLOY.md).
services:
  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/tool.db
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./data/uploads:/app/uploads
      - ./data/db:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      args:
        BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
